name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: services/backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run Lint
        run: pnpm run lint
      - name: Run Format Check
        run: pnpm run format --check
      - name: Run Tests
        run: pnpm run test:cov
      - name: Build
        run: pnpm run build

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: services/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run Lint
        run: pnpm run lint
      - name: Run Format Check
        run: pnpm run format --check
      - name: Run Tests
        run: pnpm run test:cov
      - name: Build
        run: pnpm run build

  worker-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Run Tests
        run: make test-cov
      - name: Build
        run: make build

  collector-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collector
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/collector/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Lint
        run: flake8 . --exclude venv --statistics
      - name: Run Tests
        run: pytest --cov=src --cov-report=xml
