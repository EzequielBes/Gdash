services:
  # ==================== INFRASTRUCTURE ====================

  # MongoDB - Banco de dados principal
  mongodb:
    image: mongo:7.0
    container_name: gdash-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - gdash-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: gdash-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gdash-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # ==================== BACKEND ====================

  # NestJS API
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: gdash-backend
    ports:
      - "${PORT}:${PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/gdash_db?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      DEFAULT_USER_EMAIL: ${DEFAULT_USER_EMAIL}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gdash-network
    healthcheck:
      test: curl -f http://localhost:${PORT}/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # ==================== WORKER ====================

  # Go Worker - Processa mensagens da fila
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: gdash-worker
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      API_BASE_URL: http://backend:${PORT}
      GO_LOG_LEVEL: ${GO_LOG_LEVEL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - gdash-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

  # ==================== COLLECTOR ====================

  # Python Collector - Coleta dados climáticos
  collector:
    build:
      context: ./services/collector
      dockerfile: Dockerfile
    container_name: gdash-collector
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      LATITUDE: ${LATITUDE}
      LONGITUDE: ${LONGITUDE}
      CITIES: ${CITIES}
      COLLECTION_INTERVAL: ${COLLECTION_INTERVAL}
      PYTHON_LOG_LEVEL: ${PYTHON_LOG_LEVEL}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - gdash-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

  # ==================== FRONTEND ====================

  # React Frontend
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: gdash-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_APP_NAME: ${VITE_APP_NAME}
    depends_on:
      - backend
    networks:
      - gdash-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

networks:
  gdash-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  rabbitmq_data:
